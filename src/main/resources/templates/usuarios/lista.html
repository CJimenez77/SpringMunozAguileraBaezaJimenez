
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Gestión de Usuarios</h2>
            <small class="text-muted">Lista general de usuarios registrados</small>
        </div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-success">
            <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
        </a>
    </div>

    <div class="card shadow border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-3">Foto</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="ps-3">
                        <img th:src="${u.foto != null ? u.foto : 'https://placehold.co/45x45?text=U'}"
                             class="rounded-circle border" width="45" height="45" style="object-fit: cover;">
                    </td>
                    <td class="fw-semibold" th:text="${u.nombre}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.telefono != null && !u.telefono.isEmpty() ? u.telefono : '-'}"></td>
                    <td>
                        <span class="badge bg-primary" th:text="${u.rol}"></span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Desea eliminar este usuario?');">
                            <i class="bi bi-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center py-4 text-muted">No existen usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
