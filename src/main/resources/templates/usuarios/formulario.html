<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        function mostrarImagen(event) {
            const imagen = document.getElementById("preview");
            const archivo = event.target.files[0];
            if (archivo) {
                imagen.src = URL.createObjectURL(archivo);
            }
        }
    </script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
    </div>
</nav>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h4 class="fw-bold mb-0 text-dark" th:text="${usuario.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}"></h4>
                    <p class="text-muted small mt-1 mb-0">Complete la información de perfil y acceso</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/usuarios/guardar}" enctype="multipart/form-data" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-4 text-center">
                            <img id="preview" class="rounded-circle border mb-2 shadow-sm"
                                 th:src="*{foto != null && !foto.isEmpty() ? foto : 'https://placehold.co/110x110?text=Foto'}"
                                 width="110" height="110" style="object-fit: cover;">
                            <div class="col-8 mx-auto">
                                <input type="file" class="form-control form-control-sm" name="archivoFoto" accept="image/*" onchange="mostrarImagen(event)">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Juan Pérez" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" th:field="*{password}" placeholder="******" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-semibold">Teléfono</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                                    <input type="text" class="form-control" th:field="*{telefono}" placeholder="+56 9 1234 5678">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-semibold">Rol del Sistema</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <select class="form-select" th:field="*{rol}" required>
                                        <option value="CLIENTE">Cliente</option>
                                        <option value="ADMIN_COMPLEJO">Dueño de Complejo</option>
                                        <option value="ADMIN_SISTEMA">Administrador</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/usuarios}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
