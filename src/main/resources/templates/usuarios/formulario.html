<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function mostrarImagen(event) {
            const imagen = document.getElementById("preview");
            const archivo = event.target.files[0];
            if (archivo) {
                imagen.src = URL.createObjectURL(archivo);
            }
        }
    </script>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h4 fw-bold" th:text="${usuario.id != null} ? 'Editar Usuario' : 'Registrar Usuario'"></h2>
                        <p class="text-muted">Complete los datos del usuario</p>
                    </div>

                    <form th:action="@{/usuarios/guardar}" enctype="multipart/form-data" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3 text-center">
                            <label class="form-label fw-semibold d-block">Foto de perfil</label>
                            <img id="preview" class="rounded-circle border mb-2"
                                 th:src="*{foto != null} ? *{foto} : 'https://placehold.co/120x120?text=Foto'"
                                 width="120" height="120" style="object-fit: cover;">
                            <input type="file" class="form-control form-control-sm" name="archivoFoto" accept="image/*" onchange="mostrarImagen(event)">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Juan Pérez" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="usuario@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="******" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Teléfono</label>
                                <input type="text" class="form-control" th:field="*{telefono}" placeholder="+56 9 1234 5678">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Rol</label>
                                <select class="form-select" th:field="*{rol}" required>
                                    <option value="CLIENTE">Cliente</option>
                                    <option value="ADMIN_COMPLEJO">Dueño de Complejo</option>
                                    <option value="ADMIN_SISTEMA">Administrador</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Volver</a>
                            <button type="submit" class="btn btn-primary px-4">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
