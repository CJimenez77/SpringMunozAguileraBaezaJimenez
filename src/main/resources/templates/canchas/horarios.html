<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Disponibilidad - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .table > :not(caption) > * > * {
            padding: 0.9rem 0.75rem;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/canchas}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver a Canchas
            </a>
        </div>
    </div>
</nav>

<div class="container py-4 py-md-5">
    <div class="mb-4 pb-2 border-bottom">
        <h2 class="fw-bold mb-1 text-dark">
            Horarios de Disponibilidad: <span class="text-primary" th:text="${cancha.nombre_cancha}"></span>
        </h2>
        <p class="text-muted small mb-0">Configura el horario de apertura, cierre y días operativos de esta cancha</p>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4" style="width: 150px;">Día</th>
                    <th style="width: 130px;">Estado</th>
                    <th>Hora Apertura</th>
                    <th>Hora Cierre</th>
                    <th class="text-end pe-4" style="width: 160px;">Guardar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${horarios}">
                    <form th:action="@{/canchas/{id}/horarios/guardar(id=${cancha.id_cancha})}" method="post">
                        <input type="hidden" name="diaSemana" th:value="${h.diaSemana}">
                        <td class="ps-4 fw-bold text-dark" th:text="${h.getNombreDia()}"></td>
                        <td>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" name="abierto" value="true" th:checked="${h.abierto}" id="switch-${h.diaSemana}">
                                <label class="form-check-label small" th:text="${h.abierto ? 'Abierto' : 'Cerrado'}"></label>
                            </div>
                        </td>
                        <td>
                            <input type="time" class="form-control form-control-sm" name="horaApertura" th:value="${h.horaApertura}" required style="max-width: 140px;">
                        </td>
                        <td>
                            <input type="time" class="form-control form-control-sm" name="horaCierre" th:value="${h.horaCierre}" required style="max-width: 140px;">
                        </td>
                        <td class="text-end pe-4">
                            <button type="submit" class="btn btn-sm btn-primary px-3 shadow-sm">
                                <i class="bi bi-check2"></i> Actualizar
                            </button>
                        </td>
                    </form>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
