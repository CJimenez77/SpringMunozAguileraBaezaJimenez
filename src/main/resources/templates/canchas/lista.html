<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Canchas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table > :not(caption) > * > * {
            padding: 0.9rem 0.75rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4 py-md-5">

    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-sm-7 col-md-8">
            <h2 class="fw-bold mb-1 text-dark">
                Gestión de Canchas <span th:if="${complejoFiltro != null}" th:text="' - ' + ${complejoFiltro.nombre_complejo}"></span>
            </h2>
            <p class="text-muted small mb-0">Lista de canchas deportivas</p>
        </div>
        <div class="col-12 col-sm-5 col-md-4 d-flex justify-content-end gap-2">
            <a th:href="@{/canchas}" th:if="${complejoFiltro != null}" class="btn btn-secondary px-3 shadow-sm">
                Ver todas
            </a>
            <a th:href="@{/canchas/nuevo}" class="btn btn-success px-3 shadow-sm w-100 w-sm-auto">
                Nueva Cancha
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(canchas)}" class="card shadow-sm border-0 text-center py-5">
        <div class="card-body">
            <h5 class="fw-semibold mt-3 mb-1">No hay canchas registradas</h5>
            <p class="text-muted small">Crea la primera cancha haciendo clic en el botón superior.</p>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(canchas)}">
        <!-- Vista móvil (tarjetas) -->
        <div class="d-md-none">
            <div th:each="c : ${canchas}" class="card shadow-sm border-0 mb-3">
                <div class="card-body p-3">
                    <div class="mb-3">
                        <h6 class="fw-bold mb-1" th:text="${c.nombre_cancha}"></h6>
                        <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="'ID: ' + ${c.id_cancha}"></span>
                        <span class="badge bg-info-subtle text-info border border-info-subtle" th:text="${c.tipo_cancha}"></span>
                    </div>

                    <div class="small bg-light p-2 rounded mb-3">
                        <div class="mb-1">
                            <strong class="text-secondary me-1">Complejo:</strong>
                            <a th:href="@{/canchas/complejo/{id}(id=${c.complejo.id_complejo})}" th:text="${c.complejo.nombre_complejo}"></a>
                        </div>
                        <div>
                            <strong class="text-secondary me-1">Precio x Hora:</strong>
                            <span th:text="'$' + ${c.precio_hora}"></span>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{/canchas/editar/{id}(id=${c.id_cancha})}" class="btn btn-outline-primary btn-sm flex-fill">
                            Editar
                        </a>
                        <a th:href="@{/canchas/eliminar/{id}(id=${c.id_cancha})}"
                           class="btn btn-outline-danger btn-sm flex-fill"
                           onclick="return confirm('¿Seguro que deseas eliminar esta cancha?');">
                            Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista escritorio (tabla) -->
        <div class="card shadow-sm border-0 d-none d-md-block overflow-hidden">
            <div class="table-responsive mb-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3" style="width: 80px;">ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Complejo</th>
                        <th>Precio/Hora</th>
                        <th class="text-end pe-4" style="width: 200px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${canchas}">
                        <td class="ps-3 fw-semibold text-muted" th:text="${c.id_cancha}"></td>
                        <td class="fw-bold" th:text="${c.nombre_cancha}"></td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${c.tipo_cancha}"></span>
                        </td>
                        <td>
                            <a th:href="@{/canchas/complejo/{id}(id=${c.complejo.id_complejo})}" th:text="${c.complejo.nombre_complejo}"></a>
                        </td>
                        <td class="text-success fw-bold" th:text="'$' + ${c.precio_hora}"></td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/canchas/editar/{id}(id=${c.id_cancha})}"
                                   class="btn btn-sm btn-outline-primary px-2 py-1">
                                    Editar
                                </a>
                                <a th:href="@{/canchas/eliminar/{id}(id=${c.id_cancha})}"
                                   class="btn btn-sm btn-outline-danger px-2 py-1"
                                   onclick="return confirm('¿Seguro que deseas eliminar esta cancha?');">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
