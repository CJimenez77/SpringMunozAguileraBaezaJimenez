<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canchas - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            white-space: nowrap;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/complejos}"><i class="bi bi-geo-alt-fill me-1"></i>Complejos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/canchas}"><i class="bi bi-grid-fill me-1"></i>Canchas</a>
                </li>
                <li class="nav-item" th:if="${usuarioLogueado.rol == 'ADMIN_SISTEMA'}">
                    <a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-people-fill me-1"></i>Usuarios</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm" title="Cerrar Sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4 py-md-5">
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-sm-7 col-md-8">
            <h2 class="fw-bold mb-1 text-dark">
                Gestión de Canchas <span class="text-primary" th:if="${complejoFiltro != null}" th:text="'(' + ${complejoFiltro.nombre_complejo} + ')'"></span>
            </h2>
            <p class="text-muted small mb-0">Administración de recintos y tarifas por hora</p>
        </div>
        <div class="col-12 col-sm-5 col-md-4 d-flex justify-content-sm-end gap-2">
            <a th:href="@{/canchas}" th:if="${complejoFiltro != null}" class="btn btn-outline-secondary btn-action shadow-sm">
                <i class="bi bi-funnel"></i> Quitar filtro
            </a>
            <a th:if="${usuarioLogueado.rol != 'CLIENTE'}" th:href="@{/canchas/nuevo}" class="btn btn-success px-3 shadow-sm btn-action flex-fill flex-sm-grow-0">
                <i class="bi bi-plus-lg"></i>
                <span>Nueva Cancha</span>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(canchas)}" class="card shadow-sm border-0 text-center py-5">
        <div class="card-body">
            <i class="bi bi-grid-3x3-gap text-muted" style="font-size: 3rem;"></i>
            <h5 class="fw-semibold mt-3 mb-1">No hay canchas registradas</h5>
            <p class="text-muted small">Agrega una cancha asociada a un recinto deportivo.</p>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(canchas)}">
        <div class="col" th:each="c : ${canchas}">
            <div class="card shadow-sm border-0 h-100">
                <img th:src="${c.foto != null && !c.foto.isEmpty() ? c.foto : 'https://placehold.co/400x220?text=Cancha'}"
                     class="card-img-top" style="height: 160px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <h6 class="fw-bold mb-0" th:text="${c.nombre_cancha}"></h6>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${c.tipo_cancha}"></span>
                    </div>
                    <a class="text-muted text-decoration-none small mb-1" th:href="@{/canchas/complejo/{id}(id=${c.complejo.id_complejo})}">
                        <i class="bi bi-building me-1"></i><span th:text="${c.complejo.nombre_complejo}"></span>
                    </a>
                    <p class="fw-bold text-success mb-3" th:text="'$' + ${#numbers.formatInteger(c.precio_hora, 3, 'POINT')} + ' / hr'"></p>

                    <div class="mt-auto">
                        <a th:href="@{/reservas/crear(canchaId=${c.id_cancha})}" class="btn btn-sm btn-success btn-action w-100 mb-2">
                            <i class="bi bi-calendar-plus"></i> Reservar
                        </a>
                        <div class="d-flex gap-2" th:if="${usuarioLogueado.rol != 'CLIENTE'}">
                            <a th:href="@{/canchas/{id}/horarios(id=${c.id_cancha})}" class="btn btn-sm btn-outline-secondary btn-action flex-fill" title="Horarios de Apertura">
                                <i class="bi bi-clock"></i>
                            </a>
                            <a th:href="@{/canchas/{id}/tarifas(id=${c.id_cancha})}" class="btn btn-sm btn-outline-warning text-dark btn-action flex-fill" title="Tarifas Peak">
                                <i class="bi bi-graph-up"></i>
                            </a>
                            <a th:href="@{/canchas/editar/{id}(id=${c.id_cancha})}" class="btn btn-sm btn-outline-primary btn-action flex-fill" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/canchas/eliminar/{id}(id=${c.id_cancha})}" class="btn btn-sm btn-outline-danger btn-action flex-fill" title="Eliminar" onclick="return confirm('¿Desea eliminar esta cancha?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
