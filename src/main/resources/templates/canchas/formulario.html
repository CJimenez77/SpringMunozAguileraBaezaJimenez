<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Cancha - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        function mostrarImagen(event) {
            const imagen = document.getElementById("preview");
            const archivo = event.target.files[0];
            if (archivo) {
                imagen.src = URL.createObjectURL(archivo);
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
    </div>
</nav>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h4 class="fw-bold mb-0 text-dark" th:text="${cancha.id_cancha != null ? 'Editar Cancha' : 'Nueva Cancha'}"></h4>
                    <p class="text-muted small mt-1 mb-0">Defina los parámetros, fotografía y tarifas de la cancha</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/canchas/guardar}" enctype="multipart/form-data" th:object="${cancha}" method="post">
                        <input type="hidden" th:field="*{id_cancha}">

                        <div class="mb-4 text-center">
                            <img id="preview" class="rounded border mb-2 shadow-sm"
                                 th:src="*{foto != null && !foto.isEmpty() ? foto : 'https://placehold.co/320x180?text=Foto+Cancha'}"
                                 width="280" height="150" style="object-fit: cover;">
                            <div class="col-10 mx-auto">
                                <label class="form-label small fw-semibold text-muted d-block">Foto de la Cancha</label>
                                <input type="file" class="form-control form-control-sm" name="archivoFoto" accept="image/*" onchange="mostrarImagen(event)">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nombre de la Cancha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-dribbble"></i></span>
                                <input type="text" class="form-control" th:field="*{nombre_cancha}" placeholder="Ej: Cancha Principal" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Disciplina / Deporte</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-activity"></i></span>
                                <select class="form-select" th:field="*{tipo_cancha}" required>
                                    <option value="" disabled selected>Seleccione deporte...</option>
                                    <option value="Fútbol">Fútbol</option>
                                    <option value="Pádel">Pádel</option>
                                    <option value="Tenis">Tenis</option>
                                    <option value="Básquetbol">Básquetbol</option>
                                    <option value="Vóleibol">Vóleibol</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tarifa Base por Hora (CLP)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-currency-dollar"></i></span>
                                <input type="number" class="form-control" th:field="*{precio_hora}" placeholder="Ej: 20000" min="0" step="500" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Complejo Perteneciente</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                                <select class="form-select" th:field="*{complejo}" required>
                                    <option value="" disabled selected>Seleccione complejo...</option>
                                    <option th:each="comp : ${complejos}" th:value="${comp.id_complejo}" th:text="${comp.nombre_complejo}"></option>
                                </select>
                            </div>
                            <div th:if="${#lists.isEmpty(complejos)}" class="form-text text-danger">
                                Debe existir al menos un complejo registrado previamente.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/canchas}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm" th:disabled="${#lists.isEmpty(complejos)}">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
