<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Cancha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h4 class="fw-bold mb-0 text-dark" th:text="${cancha.id_cancha != null ? 'Editar Cancha' : 'Nueva Cancha'}"></h4>
                </div>
                
                <div class="card-body p-4">
                    <form th:action="@{/canchas/guardar}" th:object="${cancha}" method="post">
                        
                        <input type="hidden" th:field="*{id_cancha}">

                        <div class="mb-3">
                            <label for="nombre_cancha" class="form-label fw-semibold">Nombre de la Cancha</label>
                            <input type="text" class="form-control" id="nombre_cancha" th:field="*{nombre_cancha}" required placeholder="Ej. Cancha 1">
                        </div>

                        <div class="mb-3">
                            <label for="tipo_cancha" class="form-label fw-semibold">Tipo de Deporte</label>
                            <select class="form-select" id="tipo_cancha" th:field="*{tipo_cancha}" required>
                                <option value="" disabled selected>Seleccione un tipo...</option>
                                <option value="Fútbol">Fútbol</option>
                                <option value="Pádel">Pádel</option>
                                <option value="Tenis">Tenis</option>
                                <option value="Básquet">Básquet</option>
                                <option value="Vóleibol">Vóleibol</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="precio_hora" class="form-label fw-semibold">Precio por Hora ($)</label>
                            <input type="number" class="form-control" id="precio_hora" th:field="*{precio_hora}" required placeholder="Ej. 15000" min="0">
                        </div>
                        
                        <div class="mb-4">
                            <label for="complejo" class="form-label fw-semibold">Complejo Deportivo</label>
                            <select class="form-select" id="complejo" th:field="*{complejo}" required>
                                <option value="" disabled selected>Seleccione el complejo...</option>
                                <option th:each="comp : ${complejos}" 
                                        th:value="${comp.id_complejo}" 
                                        th:text="${comp.nombre_complejo}">
                                </option>
                            </select>
                            <div th:if="${#lists.isEmpty(complejos)}" class="form-text text-danger">
                                No hay complejos creados. Primero debes crear un complejo.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/canchas}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm" th:disabled="${#lists.isEmpty(complejos)}">
                                Guardar Cancha
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
