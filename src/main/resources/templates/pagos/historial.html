<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pagos - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .table > :not(caption) > * > * {
            padding: 0.85rem 0.75rem;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/reservas/mis-reservas}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-calendar-check me-1"></i>Mis Reservas
            </a>
        </div>
    </div>
</nav>

<div class="container py-4 py-md-5">
    <div class="mb-4 pb-2 border-bottom">
        <h2 class="fw-bold mb-1 text-dark">Historial de Pagos y Transacciones</h2>
        <p class="text-muted small mb-0">Registro histórico de pagos realizados mediante Webpay Plus</p>
    </div>

    <div th:if="${#lists.isEmpty(pagos)}" class="card shadow-sm border-0 text-center py-5">
        <div class="card-body">
            <i class="bi bi-credit-card text-muted" style="font-size: 3rem;"></i>
            <h5 class="fw-semibold mt-3 mb-1">No hay pagos registrados</h5>
            <p class="text-muted small">Tus comprobantes aparecerán aquí una vez que completes una reserva.</p>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(pagos)}" class="card shadow-sm border-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">Fecha</th>
                    <th>Orden de Compra</th>
                    <th>Cancha</th>
                    <th>Método</th>
                    <th>Monto</th>
                    <th>Estado</th>
                    <th class="text-end pe-4">Comprobante</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pagos}">
                    <td class="ps-4 text-muted small" th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="fw-bold text-dark" th:text="${p.reserva.codigoReserva}"></td>
                    <td th:text="${p.reserva.cancha.nombre_cancha}"></td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${p.metodoPago}"></span>
                        <small class="text-muted d-block" th:if="${p.ultimosDigitos != null}" th:text="'**** ' + ${p.ultimosDigitos}"></small>
                    </td>
                    <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatInteger(p.monto, 3, 'POINT')} + ' CLP'"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${p.estado == 'PAGADO' ? 'bg-success' : (p.estado == 'REEMBOLSADO' ? 'bg-info' : (p.estado == 'FALLIDO' ? 'bg-danger' : 'bg-warning text-dark'))}"
                              th:text="${p.estado}"></span>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/pagos/comprobante/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-file-earmark-text"></i> Voucher
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
