<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Complejos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table > :not(caption) > * > * {
            padding: 0.9rem 0.75rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4 py-md-5">

    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-sm-7 col-md-8">
            <h2 class="fw-bold mb-1 text-dark">Gestión de Complejos</h2>
            <p class="text-muted small mb-0">Lista de recintos deportivos disponibles</p>
        </div>
        <div class="col-12 col-sm-5 col-md-4 text-sm-end">
            <a th:href="@{/complejos/nuevo}" class="btn btn-success px-3 shadow-sm w-100 w-sm-auto">
                Nuevo Complejo
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(complejos)}" class="card shadow-sm border-0 text-center py-5">
        <div class="card-body">
            <h5 class="fw-semibold mt-3 mb-1">No hay complejos registrados</h5>
            <p class="text-muted small">Crea el primer complejo haciendo clic en el botón superior.</p>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(complejos)}">
        <!-- Vista móvil (tarjetas) -->
        <div class="d-md-none">
            <div th:each="c : ${complejos}" class="card shadow-sm border-0 mb-3">
                <div class="card-body p-3">
                    <div class="mb-3">
                        <h6 class="fw-bold mb-1" th:text="${c.nombre_complejo}"></h6>
                        <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="'ID: ' + ${c.id_complejo}"></span>
                    </div>

                    <div class="small bg-light p-2 rounded mb-3">
                        <div class="mb-1">
                            <strong class="text-secondary me-1">Dirección:</strong>
                            <span th:text="${c.direccion_complejo}"></span>
                        </div>
                        <div>
                            <strong class="text-secondary me-1">Mapa:</strong>
                            <a th:if="${c.ubicacionMapa != null && !c.ubicacionMapa.isEmpty()}" th:href="${c.ubicacionMapa}" target="_blank">Ver enlace</a>
                            <span th:if="${c.ubicacionMapa == null || c.ubicacionMapa.isEmpty()}">Sin ubicación</span>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{/complejos/editar/{id}(id=${c.id_complejo})}" class="btn btn-outline-primary btn-sm flex-fill">
                            Editar
                        </a>
                        <a th:href="@{/complejos/eliminar/{id}(id=${c.id_complejo})}"
                           class="btn btn-outline-danger btn-sm flex-fill"
                           onclick="return confirm('¿Seguro que deseas eliminar este complejo?');">
                            Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista escritorio (tabla) -->
        <div class="card shadow-sm border-0 d-none d-md-block overflow-hidden">
            <div class="table-responsive mb-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3" style="width: 80px;">ID</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Mapa</th>
                        <th class="text-end pe-4" style="width: 200px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${complejos}">
                        <td class="ps-3 fw-semibold text-muted" th:text="${c.id_complejo}"></td>
                        <td class="fw-bold" th:text="${c.nombre_complejo}"></td>
                        <td class="text-muted" th:text="${c.direccion_complejo}"></td>
                        <td>
                            <a th:if="${c.ubicacionMapa != null && !c.ubicacionMapa.isEmpty()}" th:href="${c.ubicacionMapa}" target="_blank" class="text-decoration-none">
                                Abrir link
                            </a>
                            <span class="text-muted small" th:if="${c.ubicacionMapa == null || c.ubicacionMapa.isEmpty()}">-</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/complejos/editar/{id}(id=${c.id_complejo})}"
                                   class="btn btn-sm btn-outline-primary px-2 py-1">
                                    Editar
                                </a>
                                <a th:href="@{/complejos/eliminar/{id}(id=${c.id_complejo})}"
                                   class="btn btn-sm btn-outline-danger px-2 py-1"
                                   onclick="return confirm('¿Seguro que deseas eliminar este complejo?');">
                                    Eliminar
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
