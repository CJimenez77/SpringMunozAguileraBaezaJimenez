<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Complejo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h4 fw-bold" th:text="${complejo.id_complejo != null} ? 'Editar Complejo' : 'Registrar Complejo'"></h2>
                        <p class="text-muted">Complete los datos del recinto deportivo</p>
                    </div>

                    <form th:action="@{/complejos/guardar}" th:object="${complejo}" method="post">
                        <input type="hidden" th:field="*{id_complejo}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del Complejo</label>
                            <input type="text" class="form-control" th:field="*{nombre_complejo}" placeholder="Ej: Complejo Deportivo Quilamapu" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dirección</label>
                            <input type="text" class="form-control" th:field="*{direccion_complejo}" placeholder="Ej: Av. Andrés Bello 800, Chillán" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ubicación (Google Maps URL)</label>
                            <input type="text" class="form-control" th:field="*{ubicacionMapa}" placeholder="https://maps.app.goo.gl/...">
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/complejos}" class="btn btn-outline-secondary">Volver</a>
                            <button type="submit" class="btn btn-primary px-4">Guardar Complejo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
