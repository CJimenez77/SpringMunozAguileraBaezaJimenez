<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Complejo - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        function mostrarImagen(event) {
            const imagen = document.getElementById("preview");
            const archivo = event.target.files[0];
            if (archivo) {
                imagen.src = URL.createObjectURL(archivo);
            }
        }
    </script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
    </div>
</nav>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                    <h4 class="fw-bold mb-0 text-dark" th:text="${complejo.id_complejo != null ? 'Editar Complejo' : 'Nuevo Complejo'}"></h4>
                    <p class="text-muted small mt-1 mb-0">Ingrese los antecedentes del recinto deportivo y su fotografía</p>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/complejos/guardar}" enctype="multipart/form-data" th:object="${complejo}" method="post">
                        <input type="hidden" th:field="*{id_complejo}">

                        <div class="mb-4 text-center">
                            <img id="preview" class="rounded border mb-2 shadow-sm"
                                 th:src="*{foto != null && !foto.isEmpty() ? foto : 'https://placehold.co/320x180?text=Foto+Complejo'}"
                                 width="280" height="150" style="object-fit: cover;">
                            <div class="col-10 mx-auto">
                                <label class="form-label small fw-semibold text-muted d-block">Foto del Complejo</label>
                                <input type="file" class="form-control form-control-sm" name="archivoFoto" accept="image/*" onchange="mostrarImagen(event)">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nombre del Complejo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control" th:field="*{nombre_complejo}" placeholder="Ej: Quilamapu" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Dirección</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control" th:field="*{direccion_complejo}" placeholder="Ej: Av. Andrés Bello 800" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Enlace de Google Maps</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-link-45deg"></i></span>
                                <input type="text" class="form-control" th:field="*{ubicacionMapa}" placeholder="https://maps.app.goo.gl/...">
                            </div>
                            <div class="form-text small text-muted">Copia y pega el enlace compartido directamente desde Google Maps.</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/complejos}" class="btn btn-light px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
