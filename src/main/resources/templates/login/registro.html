<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="card register-card p-4 bg-white border-0 shadow-sm my-4">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-25 rounded-circle p-3 mb-2">
            <i class="bi bi-person-plus-fill text-success fs-2"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Crear Cuenta</h4>
        <p class="text-muted small mb-0">Regístrate para reservar canchas deportivas</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Nombre Completo</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ej: Juan Pérez" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" th:field="*{email}" placeholder="usuario@correo.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Teléfono</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                <input type="text" class="form-control" th:field="*{telefono}" placeholder="+56 9 1234 5678">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" th:field="*{password}" placeholder="******" required>
            </div>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success fw-semibold py-2 shadow-sm">
                Registrarse
            </button>
        </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">¿Ya tienes cuenta?</span>
        <a th:href="@{/login}" class="text-decoration-none small fw-semibold ms-1">Iniciar Sesión</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
