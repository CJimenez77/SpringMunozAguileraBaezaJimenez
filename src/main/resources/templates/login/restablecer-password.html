<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body>
<div class="card login-card p-4 bg-white border-0 shadow-sm my-4">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle p-3 mb-2">
            <i class="bi bi-key-fill fs-2"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Nueva Contraseña</h4>
        <p class="text-muted small mb-0">Ingresa tu nueva clave de acceso</p>
    </div>

    <div th:if="${tokenInvalido}" class="alert alert-danger py-3 small text-center" role="alert">
        <p class="mb-2">El enlace de recuperación es inválido o ha caducado (duración máxima 1 hora).</p>
        <a th:href="@{/recuperar-password}" class="btn btn-outline-danger btn-sm">Solicitar un nuevo enlace</a>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
        <span th:text="${error}"></span>
    </div>

    <form th:if="${!tokenInvalido}" th:action="@{/restablecer-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Nueva Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="******" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label for="confirmarPassword" class="form-label small fw-semibold">Confirmar Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword" placeholder="******" required>
            </div>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success fw-semibold py-2 shadow-sm">
                Guardar Nueva Contraseña
            </button>
        </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <a th:href="@{/login}" class="text-decoration-none small text-secondary">
            <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
