<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="card login-card p-4 bg-white border-0 shadow-sm">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-25 rounded-circle p-3 mb-2">
            <i class="bi bi-trophy-fill text-warning fs-2"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">CanchasYa</h4>
        <p class="text-muted small mb-0">Sistema de Gestión de Recintos Deportivos</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 small text-center" role="alert">
        Sesión finalizada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required autofocus>
            </div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="******" required>
            </div>
        </div>
        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary fw-semibold py-2 shadow-sm">
                Ingresar al Portal
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
