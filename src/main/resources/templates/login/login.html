<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Canchas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <div class="card login-card p-4 bg-white border-0">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
            <p class="text-muted small">Ingresa tus credenciales para continuar</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success py-2 small text-center" role="alert">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="ejemplo@correo.com"
                    required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                    required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary fw-semibold py-2">
                    Ingresar
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
