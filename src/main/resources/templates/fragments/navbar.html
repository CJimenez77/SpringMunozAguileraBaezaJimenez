<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" aria-label="Navegación principal">
    <div class="container-fluid px-3 px-lg-4 navbar-nav-container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2 me-lg-3 flex-shrink-0" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning" aria-hidden="true"></i>
            <span>CanchasYa</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Alternar navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 flex-lg-wrap align-items-lg-center">
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'inicio' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'inicio' ? 'page' : null}"
                       th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'explorar' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'explorar' ? 'page' : null}"
                       th:href="@{/explorar}">
                        <i class="bi bi-compass me-1" aria-hidden="true"></i>Explorar
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'favoritos' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'favoritos' ? 'page' : null}"
                       th:href="@{/favoritos}">
                        <i class="bi bi-heart-fill me-1 text-danger" aria-hidden="true"></i>Favoritos
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'reservas' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'reservas' ? 'page' : null}"
                       th:href="@{/reservas/mis-reservas}">
                        <i class="bi bi-calendar-check me-1" aria-hidden="true"></i>Reservas
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'pagos' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'pagos' ? 'page' : null}"
                       th:href="@{/pagos/historial}">
                        <i class="bi bi-credit-card me-1" aria-hidden="true"></i>Pagos
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'complejos' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'complejos' ? 'page' : null}"
                       th:href="@{/complejos}">
                        <i class="bi bi-geo-alt-fill me-1" aria-hidden="true"></i>Complejos
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'canchas' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'canchas' ? 'page' : null}"
                       th:href="@{/canchas}">
                        <i class="bi bi-grid-fill me-1" aria-hidden="true"></i>Canchas
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null && usuarioActual.rol != 'CLIENTE'}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'reportes' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'reportes' ? 'page' : null}"
                       th:href="@{/reportes}">
                        <i class="bi bi-graph-up-arrow me-1" aria-hidden="true"></i>Reportes
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null && (usuarioActual.rol == 'ADMIN_SISTEMA' || usuarioActual.rol == 'ADMIN_COMPLEJO')}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'estadisticas' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'estadisticas' ? 'page' : null}"
                       th:href="@{/estadisticas}">
                        <i class="bi bi-bar-chart-line me-1" aria-hidden="true"></i>Estadísticas
                    </a>
                </li>
                <li class="nav-item" th:if="${usuarioActual != null && usuarioActual.rol == 'ADMIN_SISTEMA'}">
                    <a class="nav-link"
                       th:classappend="${activeTab == 'usuarios' ? 'active' : ''}"
                       th:attr="aria-current=${activeTab == 'usuarios' ? 'page' : null}"
                       th:href="@{/usuarios}">
                        <i class="bi bi-people-fill me-1" aria-hidden="true"></i>Usuarios
                    </a>
                </li>
            </ul>

            <div id="navbarUserArea" class="d-flex align-items-center gap-2 ms-lg-3 flex-shrink-0 pt-2 pt-lg-0">
                <div class="d-flex align-items-center gap-2 text-white me-1" th:if="${usuarioActual != null}">
                    <img th:src="${usuarioActual.foto != null && !usuarioActual.foto.isEmpty() ? usuarioActual.foto : 'https://placehold.co/40x40?text=U'}"
                         class="rounded-circle border border-secondary flex-shrink-0" width="32" height="32" style="object-fit: cover;"
                         th:alt="${usuarioActual.nombre}" th:title="${usuarioActual.nombre}">
                    <span class="small fw-semibold text-truncate" style="max-width: 140px;" th:text="${usuarioActual.nombre}">Usuario</span>
                    <span class="badge rounded-pill bg-warning text-dark d-inline-flex align-items-center gap-1 py-1 px-2"
                          th:if="${fidelizacion != null}"
                          th:title="${fidelizacion.descuentoDisponible ? '¡2 de 2 reservas! Tienes 20% de descuento en tu próxima reserva' : 'Llevas ' + fidelizacion.reservasCompletadas + ' de 2 reservas. ' + (fidelizacion.faltantes == 1 ? 'Te falta 1 reserva' : 'Te faltan ' + fidelizacion.faltantes + ' reservas') + ' para el 20% de descuento.'}">
                        <i th:class="${fidelizacion.descuentoDisponible ? 'bi bi-gift-fill text-danger' : 'bi bi-star-fill text-dark'}"></i>
                        <span th:text="${fidelizacion.descuentoDisponible ? '2/2 (20% OFF)' : fidelizacion.reservasCompletadas + '/2 (' + (fidelizacion.faltantes == 1 ? 'Falta 1' : 'Faltan ' + fidelizacion.faltantes) + ')'}">0/2 (Faltan 2)</span>
                    </span>
                </div>
                <a th:if="${usuarioActual != null}" th:href="@{/logout}" class="btn btn-outline-light btn-sm"
                   aria-label="Cerrar sesión" title="Cerrar Sesión">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                </a>
                <a th:if="${usuarioActual == null}" th:href="@{/login}" class="btn btn-primary btn-sm text-nowrap">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
