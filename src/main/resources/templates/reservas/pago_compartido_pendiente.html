<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuota pagada - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar('reservas')}"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-5">
                    <i class="bi bi-hourglass-split text-primary" aria-hidden="true"></i>
                    <h1 class="h4 fw-bold mt-3">Tu cuota fue pagada</h1>
                    <p class="text-muted">La reserva quedará confirmada cuando todos los participantes hayan pagado.</p>
                    <a th:href="@{/reservas/invitacion/{codigo}(codigo=${participanteActual.invitacion.codigo})}"
                       class="btn btn-primary">Volver a la invitación</a>
                    <a th:href="@{/reservas/mis-reservas}" class="btn btn-outline-secondary">Mis reservas</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
