<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - CanchasYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-trophy-fill text-warning"></i>
            <span>CanchasYa</span>
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="fw-bold text-success mb-3">Pago Aprobado con Éxito</h3>
                    <p class="text-muted mb-4">Tu reserva ha sido confirmada correctamente a través de Webpay Plus.</p>

                    <div class="bg-light rounded p-3 mb-4 text-start" th:if="${response != null}">
                        <div class="row g-2 small">
                            <div class="col-6"><span class="text-muted">Orden de Compra:</span></div>
                            <div class="col-6 fw-semibold" th:text="${response.buyOrder}"></div>
                            <div class="col-6"><span class="text-muted">Código de Autorización:</span></div>
                            <div class="col-6 fw-semibold" th:text="${response.authorizationCode}"></div>
                            <div class="col-6"><span class="text-muted">Monto:</span></div>
                            <div class="col-6 fw-semibold" th:text="'$' + ${#numbers.formatInteger(response.amount, 3, 'POINT')} + ' CLP'"></div>
                            <div class="col-6"><span class="text-muted">Tipo de Pago:</span></div>
                            <div class="col-6 fw-semibold" th:text="${response.paymentTypeCode}"></div>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <a th:href="@{/reservas/mis-reservas}" class="btn btn-success fw-semibold shadow-sm">
                            <i class="bi bi-calendar-check me-1"></i>Ver Mis Reservas
                        </a>
                        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
                            Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
