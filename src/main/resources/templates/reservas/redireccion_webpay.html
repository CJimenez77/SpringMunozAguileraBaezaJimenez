<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Webpay Plus...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dark-mode.css}">
    <script th:src="@{/js/dark-mode.js}"></script>
</head>
<body class="bg-light">
    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow-sm border-0 p-5 text-center" style="max-width: 500px;">
            <div class="spinner-border text-danger mb-4" role="status" style="width: 3.5rem; height: 3.5rem;">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h4 class="fw-bold text-dark mb-2">Conectando con Transbank Webpay...</h4>
            <p class="text-muted small mb-4">Te estamos redirigiendo de forma segura al portal oficial de Transbank.</p>

            <form id="webpayForm" th:action="${url}" method="post">
                <input type="hidden" name="token_ws" th:value="${tokenWs}">
                <button type="submit" class="btn btn-danger w-100 fw-semibold">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Ir a Transbank Ahora
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('webpayForm').submit();
        });
        setTimeout(function() {
            var form = document.getElementById('webpayForm');
            if (form) form.submit();
        }, 100);
    </script>
</body>
</html>
